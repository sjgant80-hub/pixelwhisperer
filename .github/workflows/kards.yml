name: kards-gate
on: [push, pull_request, workflow_dispatch]
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: tests of the art engine, the PNG writer and the proof tools (every file on its own)
        run: node --test kards/*.test.mjs
      - name: the witness harness is witness v0.6, byte for byte (pinned tag, pinned commit, pinned hashes)
        run: |
          git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git /tmp/witness
          test "$(git -C /tmp/witness rev-parse HEAD)" = "f04fe3047e3d49b98c67713befd5b77182afa0d4" || { echo "::error::the v0.6 tag no longer names the vendored commit"; exit 1; }
          cmp .witness/witness.mjs /tmp/witness/witness.mjs
          cmp .witness/runner.mjs /tmp/witness/runner.mjs
          printf '%s  %s\n' 9918297aa5f8fc4e1d26d9e6b25226f56102fdc04f0c634155bfcba1c086ef48 .witness/witness.mjs e85f13b1b30c40c045bcb7997a5d73808c14684dcd161c4a2ea14caaf47c3a0e .witness/runner.mjs | sha256sum -c -
      - name: mutation witness - every mutant of every kernel (art and items, png, cost case, UI kit, font, estate, arena, raids, kit slots, card backs, Fusion Lab, campaign, read-back, builds, build sheet, build book, hero plate) killed, none baselined
        run: node witness-kards.mjs | tee witness.txt
      - name: the gallery images are exactly what the engine draws
        run: node tools/kards-gallery.mjs --check
      - name: the UI font file is exactly what the glyph table makes (byte for byte)
        run: node tools/kards-font.mjs --check
      - name: the published pins are what the engine draws (a red pin means a published theme was edited)
        run: node --test kards/kardart.smoke.test.mjs
      - name: the verdict
        if: always()
        run: |
          echo "### kards witness" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 10 witness.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "the gate did not reach the witness" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
